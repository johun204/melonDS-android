name: Build Fold8 Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Update SDK tools, accept licenses, install NDK + CMake
        run: |
          set -x
          sdkmanager --install "cmdline-tools;latest"
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;28.0.13004108" "cmake;3.22.1"
          # Let AGP fetch the right platform/build-tools; try explicitly but don't fail if unavailable yet
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" || \
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          sdkmanager --list_installed

      - name: Generate a self-signed release keystore
        # ponytail: fresh key every run -> reinstall on rebuild. Move the 4 values
        # to repo secrets + keytool -importkeystore for stable app updates.
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias fold8 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass fold8fold8 -keypass fold8fold8 \
            -dname "CN=melonDS Fold8, O=personal, C=US"
          {
            echo "MELONDS_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "MELONDS_KEYSTORE_PASSWORD=fold8fold8"
            echo "MELONDS_KEY_ALIAS=fold8"
            echo "MELONDS_KEY_PASSWORD=fold8fold8"
          } >> local.properties

      - name: Build release APK
        run: ./gradlew :app:assembleGitHubProdRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-fold8-release-apk
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: warn

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
